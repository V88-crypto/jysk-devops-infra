apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hyggy
spec:
  selector:
    app: hyggy-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hyggy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hyggy-frontend
  template:
    metadata:
      labels:
        app: hyggy-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: frontend
          image: ghcr.io/v88-crypto/hyggy-frontend:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
