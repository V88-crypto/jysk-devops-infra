apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hyggy-openapi
  namespace: hyggy
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
