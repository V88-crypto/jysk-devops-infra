<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applies the saved theme before the first paint so the page never
      // flashes white in dark mode. Mirrors src/shared/theme/themeStorage.ts.
      ;(function () {
        var preference = 'system'
        try {
          preference = localStorage.getItem('hyggy_theme') || 'system'
        } catch (error) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <style>
      /* Page background before the main stylesheet loads. */
      html {
        background: #f3f3f3;
      }
      html.dark {
        background: #121416;
      }
    </style>
    <title>Hyggy — меблі на будь-який смак</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
