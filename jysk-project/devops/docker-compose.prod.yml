services:
  db:
    image: mysql:8.0-debian
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: jysk_db
      MYSQL_USER: jysk_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d/low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro
    networks:
      - hyggy_network
    mem_limit: 350m

  minio:
    image: ghcr.io/v88-crypto/jysk-minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - hyggy_network
    mem_limit: 250m

  backend:
    image: ghcr.io/v88-crypto/hyggy-backend:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://jysk_user:${MYSQL_PASSWORD}@db:3306/jysk_db
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: http://${PUBLIC_HOST}
      PUBLIC_API_URL: http://${PUBLIC_HOST}/api
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: images
      MINIO_SECURE: "false"
    depends_on:
      - db
      - minio
    networks:
      - hyggy_network
    mem_limit: 200m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ghcr.io/v88-crypto/hyggy-frontend:dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - backend
    networks:
      - hyggy_network
    mem_limit: 300m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - hyggy_network
    mem_limit: 64m

volumes:
  mysql_data:
  minio_data:

networks:
  hyggy_network:
    driver: bridge
