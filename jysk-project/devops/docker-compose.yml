
services:
  db:
    image: mysql:8.0-debian
    container_name: jysk_clone_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: jysk_root_secure_password
      MYSQL_DATABASE: jysk_db
      MYSQL_USER: jysk_user
      MYSQL_PASSWORD: jysk_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jysk_network

  minio:
    image: minio/minio:latest
    container_name: jysk_clone_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - jysk_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio-init:
    image: minio/mc:latest
    container_name: jysk_clone_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/images;
      exit 0;
      "
    networks:
      - jysk_network

  backend:
    build:
      context: ../backend
      dockerfile: ../devops/Dockerfile.backend
    container_name: jysk_clone_backend
    restart: always
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://jysk_user:jysk_secure_password@db:3306/jysk_db
      - ENV=development
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=images
      - MINIO_SECURE=false
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - jysk_network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../devops/Dockerfile.frontend
    container_name: jysk_clone_frontend
    restart: always
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - jysk_network

volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local

networks:
  jysk_network:
    driver: bridge
