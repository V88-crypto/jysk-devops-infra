
services:
  db:
    image: mysql:8.0-debian
    container_name: jysk_clone_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: jysk_root_secure_password
      MYSQL_DATABASE: jysk_db
      MYSQL_USER: jysk_user
      MYSQL_PASSWORD: jysk_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jysk_network

  backend:
    build:
      context: ../backend
      dockerfile: ../devops/Dockerfile.backend
    container_name: jysk_clone_backend
    restart: always
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://jysk_user:jysk_secure_password@db:3306/jysk_db
      - ENV=development
    depends_on:
      - db
    networks:
      - jysk_network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../devops/Dockerfile.frontend
    container_name: jysk_clone_frontend
    restart: always
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - jysk_network

volumes:
  mysql_data:
    driver: local

networks:
  jysk_network:
    driver: bridge
