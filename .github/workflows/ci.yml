name: Hyggy CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: jysk-project/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jysk-project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript and Vite Build
        run: npm run build
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: jysk-project/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r jysk-project/backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q jysk-project/backend
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend image
        run: docker build -f jysk-project/devops/Dockerfile.backend -t hyggy-backend:ci ./jysk-project/backend

      - name: Build Frontend image
        run: docker build -f jysk-project/devops/Dockerfile.frontend -t hyggy-frontend:ci ./jysk-project/frontend
  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./jysk-project/backend
          file: ./jysk-project/devops/Dockerfile.backend
          push: true
          tags: ghcr.io/v88-crypto/hyggy-backend:dev
      - name: Build and Push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./jysk-project/frontend
          file: ./jysk-project/devops/Dockerfile.frontend
          push: true
          tags: ghcr.io/v88-crypto/hyggy-frontend:dev
