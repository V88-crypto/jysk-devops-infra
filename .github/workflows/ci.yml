name: Hyggy CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: jysk-project/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jysk-project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript and Vite Build
        run: npm run build
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: jysk-project/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r jysk-project/backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q jysk-project/backend
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Backend image
        run: docker build -f jysk-project/devops/Dockerfile.backend -t hyggy-backend:ci ./jysk-project/backend

      - name: Build Frontend image
        run: docker build -f jysk-project/devops/Dockerfile.frontend.prod -t hyggy-frontend:ci ./jysk-project/frontend
      - name: Test Frontend HTTP and SPA routing
        run: |
          docker run -d --name hyggy-frontend-test -p 127.0.0.1:13000:3000 hyggy-frontend:ci
          trap 'docker rm -f hyggy-frontend-test >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:13000/ -o /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --show-error http://127.0.0.1:13000/ -o /dev/null
          curl --fail --show-error http://127.0.0.1:13000/products -o /dev/null

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Backend image
        run: docker build -f jysk-project/devops/Dockerfile.backend -t hyggy-backend:security ./jysk-project/backend

      - name: Build Frontend image
        run: docker build -f jysk-project/devops/Dockerfile.frontend.prod -t hyggy-frontend:security ./jysk-project/frontend

      - name: Scan Backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: hyggy-backend:security
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: hyggy-frontend:security
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'

  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./jysk-project/backend
          file: ./jysk-project/devops/Dockerfile.backend
          push: true
          tags: ghcr.io/v88-crypto/hyggy-backend:dev
      - name: Build and Push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./jysk-project/frontend
          file: ./jysk-project/devops/Dockerfile.frontend.prod
          push: true
          tags: ghcr.io/v88-crypto/hyggy-frontend:dev
